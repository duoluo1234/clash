;Custom_OpenClash_Rules
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88

;本模板为 Full 模板，可以自由添加规则和分组，无性能考量，较为臃肿

;兼容 max_allowed_rulesets=64 的订阅转换后端，ruleset 条目总数须不超过 64

;=== 二次定制版 (duoluo1234/clash) ===
;基于上游 Aethersailor 重度分流版原版 ini, 规则/分组与原版逐条一致, 仅新增:
;  1) ⭐ 自定义 策略组 (select)
;  2) 一条自定义 ruleset -> 本仓库 rule/Custom_User_Classical.yaml (在 GitHub 改该文件即生效, 无需改本模板)
;ruleset 总数 64 条 (=原版 63 + 自定义 1), 仍在 max_allowed_rulesets=64 上限内
;二次定制追加 (2026-11-11): 删除 8 个当前订阅无节点的国家组 (韩/加/英/法/德/荷/土/俄) 的定义与全部成员引用; 有节点的 5 个国家组保留 (🌐 其他地区已于 2026-11-12 删除, 见下行)
;二次定制追加 (2026-11-12): 删除 🌐 其他地区、🏠 家宽节点、🐢 低倍率节点 三组的定义与全部成员引用; 新增 📌 单节点选择 (select, .* 匹配全部节点逐个可选), 挂入 ⭐ 自定义 (手动版另挂入 🚀 手动选择) (其中的 📌 单节点选择独立组已于同日按 jin 更正撤销, 见文末追加)
;raw: https://raw.githubusercontent.com/duoluo1234/clash/main/Custom_Clash_Full_Fallback_Custom.ini

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;自定义规则优先 (位于上游收录规则之前, 命中走 ⭐ 自定义组)
ruleset=⭐ 自定义,clash-classic:https://raw.githubusercontent.com/duoluo1234/clash/main/rule/Custom_User_Classical.yaml,28800
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 故障转移,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 故障转移,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800
;各大游戏平台下载域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
;Zoom 视频会议优先走代理，代理均不可用时回退直连
ruleset=📹 Zoom,[]GEOSITE,zoom
ruleset=📞 Talkatone,[]GEOSITE,talkatone
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🎧 Discord,[]GEOSITE,discord
;其余即时通讯域名由通用分组处理，专用规则须位于此分类之前
ruleset=💬 即时通讯,[]GEOSITE,category-communication
ruleset=🤖 Grok,[]GEOSITE,xai
;社交媒体包括了 Twitter(X)/Facebook/Instagram 等海外主流社交媒体
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=💾 OneDrive,[]GEOSITE,onedrive
ruleset=🤖 Copilot,[]GEOSITE,bing
ruleset=🤖 Claude,[]GEOSITE,anthropic
ruleset=🤖 Gemini,[]GEOSITE,google-gemini
ruleset=🤖 国外AI服务,[]GEOSITE,category-ai-!cn
;国内 AI 服务默认直连，可按需切换代理；须位于 cn 兜底规则之前
ruleset=🤖 国内AI服务,[]GEOSITE,category-ai-cn
ruleset=📦 容器服务,[]GEOSITE,docker
ruleset=📦 容器服务,[]GEOSITE,category-container
ruleset=🚀 GitHub,[]GEOSITE,github
