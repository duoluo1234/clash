; subconverter 对照版骨架 —— 仅作近似分流用, 不当 .2 主配置
; 原因: 现行规则主体是 GEOSITE/GEOIP + .mrs rule-providers + fallback 兜底组,
; ini 的 ruleset/custom_proxy_group 语法复刻不了这三样, 强行转换 = 换规则而非复刻。
; 真要用 subconverter 给客户端出订阅, 按下面结构填远程 list, 分组名与主模板保持一致即可。

[custom]
; ===== 分组 (节选示例, 全量 70 组见 mihomo-template.yaml) =====
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,50
custom_proxy_group=⭐ 自定义`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连

; ===== 规则 =====
; === CUSTOM 自定义区: 自己的域名/IP 写在这里, 排最前 ===
ruleset=⭐ 自定义,[]DOMAIN-SUFFIX,example.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,example.cn
; === 以下为近似映射, 与主模板的 GEOSITE/GEOIP 不等价 ===
ruleset=🎯 全球直连,https://example.invalid/cn.list
ruleset=🚀 手动选择,https://example.invalid/proxy.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

enable_rule_generator=true
overwrite_original_rules=true
