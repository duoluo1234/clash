# ============================================================
# 自建模板 (mihomo/OpenClash) — 2026-11-11 部署版
# 基准: 当日现行源配置 (Aethersailor 故障转移版, 63组/63规则) 逐项对齐
# 本版: 70组 (63 + 美国UI + 5兜底 + ⭐自定义) / 65规则 (63 + 2自定义) / 8 rule-providers (6 + 2本地自定义)
# 自定义只改: ⭐自定义组 / Custom_User_Domain / Custom_User_Classical (文件在 /etc/openclash/rule_provider/)
# 节点订阅只作 proxy-providers, 每小时只换节点; 本文件已取代整份配置订阅 (config_subscribe[1] 已禁用)
# ============================================================
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxy-providers:
  Provider_72D900:
    type: http
    url: REPLACE_WITH_YOUR_NODE_SUBSCRIPTION_URL
    interval: 3600
    path: ./providers/Provider_72D900.yaml
    header:
      User-Agent:
      - clash.meta/1.19.20
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      skip-cert-verify: true
      udp: true
proxy-groups:
- name: 🚀 故障转移
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - 🇭🇰 香港节点
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🇼🇸 台湾节点
  - 🇰🇷 韩国节点
  - 🇨🇦 加拿大节点
  - 🇬🇧 英国节点
  - 🇫🇷 法国节点
  - 🇩🇪 德国节点
  - 🇳🇱 荷兰节点
  - 🇹🇷 土耳其节点
  - 🇷🇺 俄罗斯节点
  - 🌐 其他地区
  - 🏠 家宽节点
  - 🐢 低倍率节点
  - ♻️ 自动选择
- name: ⭐ 自定义
  type: select
  proxies:
  - 🚀 故障转移
  - ♻️ 自动选择
  - 🎯 全球直连
- name: ♻️ 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  use:
  - Provider_72D900
  filter: .*
- name: 🇺🇸 美国UI
  type: url-test
  url: https://www.gstatic.com/generate_204
